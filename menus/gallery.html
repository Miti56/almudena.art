<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Gallery</title>
    <link rel="stylesheet" href="../css/gallery.css">
</head>

<body>
<div class="camera-display">
    <div class="gallery-screen">
        <div class="gallery-title">MY MEDIA</div>

        <div class="gallery-grid"></div>

        <div class="details-screen">
            <div class="details-container">

                <div class="details-left">
                    <div class="preview-wrapper">
                        <img src="" alt="Selected media" class="details-img-display">
                    </div>
                    <button class="back-button" id="gallery-back-button">&lt; RETURN TO INDEX</button>
                </div>

                <div class="details-right">
                    <div class="meta-header">
                        <h2 class="details-title"></h2>
                        <span class="meta-badge details-year"></span>
                    </div>

                    <div class="meta-tech-grid">
                        <div class="tech-item">
                            <span class="label">RES</span>
                            <span class="value details-res">--</span>
                        </div>
                        <div class="tech-item">
                            <span class="label">SIZE</span>
                            <span class="value details-size">--</span>
                        </div>
                        <div class="tech-item">
                            <span class="label">TIME</span>
                            <span class="value details-runtime">--</span>
                        </div>
                    </div>

                    <div class="meta-credits">
                        <div class="credit-row">
                            <span class="label">DIR:</span>
                            <span class="value details-director"></span>
                        </div>
                        <div class="credit-row">
                            <span class="label">CAST:</span>
                            <span class="value details-actor"></span>
                        </div>
                    </div>

                    <div class="meta-description-box">
                        <p class="details-description"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="ui-buttons">
        <button class="ui-btn btn-2">Gallery</button>
        <button class="ui-btn btn-disp">Disp</button>
        <button class="ui-btn btn-back">Back</button>
    </div>
</div>

<script src="../js/gallery.js"></script>
</body>
</html>
