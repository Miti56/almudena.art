<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Almudena — Viewfinder</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.7.1/css/all.min.css" />
    <link rel="stylesheet" href="css/viewfinder.css" />
</head>

<body>

<div class="camera-app">

    <div class="video-wrapper">
        <video autoplay muted loop id="bg-video">
            <source src="../previews/videoTest.mp4" type="video/mp4" />
        </video>
        <canvas id="video-effect-canvas"></canvas>
    </div>

    <div class="viewfinder-overlay"></div>

    <div class="hud-container">
        <div class="rec"><div class="content">Rec <b>&#x2022;</b></div></div>
        <div class="bat"><div class="content"><i class="fas fa-battery-full"></i></div></div>
        <div class="wifi"><div class="content"><i class="fas fa-wifi"></i></div></div>

        <div class="focus-grid"><div class="grid-lines"></div></div>
        <div class="histogram"><canvas id="histogram" width="200" height="80"></canvas></div>
    </div>

    <div class="menu-container"></div>

    <div class="ui-buttons">
        <button class="ui-btn btn-2">Gallery</button>
        <button class="ui-btn btn-disp">Disp</button>
        <button class="ui-btn btn-back">Back</button>
    </div>

    <div class="loading-screen">
        <div class="loading-text">Initializing Camera...</div>
    </div>
</div>

<script type="module" src="../js/viewfinder.js"></script>
</body>
</html>
